<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-labelledby="title desc">
  <title id="title">NoemaKernel / Bankmap architecture graph</title>
  <desc id="desc">Architecture graph showing context input, Bankmap, bidirectional evaluation, ContextJudge, compact context, LLM and multi-flow output.</desc>
  <defs>
    <style>
      .bg { fill: #fffef8; }
      .input { fill: #d8efe7; }
      .core { fill: #f5d98b; }
      .reason { fill: #d8def7; }
      .llm { fill: #ffd7c2; }
      .output { fill: #d7ecd0; }
      .audit { fill: #ece3f2; }
      .risk { fill: #f3c9c9; }
      .box { stroke: #5e686b; stroke-width: 1.6; rx: 8; }
      .edge { stroke: #839194; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .strong { stroke: #455154; stroke-width: 2.8; fill: none; marker-end: url(#arrowStrong); }
      .dash { stroke: #8d7a9f; stroke-width: 2.2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrowPurple); }
      .text { fill: #1e2528; font-family: Arial, Helvetica, sans-serif; font-size: 14px; }
      .title { font-weight: 700; font-size: 15px; }
      .label { fill: #566164; font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; }
      .group { fill: #7d8789; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#839194"/>
    </marker>
    <marker id="arrowStrong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#455154"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8d7a9f"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1220" height="760"/>
  <text class="group" x="42" y="42">INPUT: contextual flows</text>
  <text class="group" x="350" y="42">BANKMAP CORE</text>
  <text class="group" x="640" y="42">JUDGMENT + COMPACTION</text>
  <text class="group" x="930" y="42">LLM + MULTI-FLOW OUTPUT</text>

  <rect class="box input" x="40" y="78" width="210" height="74"/>
  <text class="text title" x="58" y="106">Contexts C1..Cn</text>
  <text class="text" x="58" y="129">text, memory, signals</text>

  <rect class="box input" x="40" y="184" width="210" height="78"/>
  <text class="text title" x="58" y="212">Objective / query</text>
  <text class="text" x="58" y="235">target state</text>

  <rect class="box input" x="40" y="294" width="210" height="86"/>
  <text class="text title" x="58" y="322">Base axioms</text>
  <text class="text" x="58" y="345">meaning, privacy,</text>
  <text class="text" x="58" y="364">non-intrusion</text>

  <rect class="box core" x="320" y="92" width="220" height="92"/>
  <text class="text title" x="340" y="121">Bankmap</text>
  <text class="text" x="340" y="145">route, weigh, group</text>
  <text class="text" x="340" y="164">preserve boundaries</text>

  <rect class="box reason" x="320" y="220" width="220" height="104"/>
  <text class="text title" x="340" y="249">Regressive context</text>
  <text class="text" x="340" y="273">starts from goal/end</text>
  <text class="text" x="340" y="292">finds sustentation</text>

  <rect class="box reason" x="320" y="360" width="220" height="96"/>
  <text class="text title" x="340" y="389">Progressive context</text>
  <text class="text" x="340" y="413">projects next steps</text>
  <text class="text" x="340" y="432">activates future paths</text>

  <rect class="box reason" x="600" y="92" width="220" height="92"/>
  <text class="text title" x="620" y="121">Semantic anchors</text>
  <text class="text" x="620" y="145">high contextual load</text>
  <text class="text" x="620" y="164">open noemas</text>

  <rect class="box reason" x="600" y="220" width="220" height="92"/>
  <text class="text title" x="620" y="249">Bidirectional stability</text>
  <text class="text" x="620" y="273">regressive + progressive</text>
  <text class="text" x="620" y="292">75.30% avg score</text>

  <rect class="box audit" x="600" y="348" width="220" height="108"/>
  <text class="text title" x="620" y="377">ContextJudge</text>
  <text class="text" x="620" y="401">Semantic Sustainment</text>
  <text class="text" x="620" y="420">promote / compact</text>
  <text class="text" x="620" y="439">audit / discard</text>

  <rect class="box core" x="600" y="492" width="220" height="92"/>
  <text class="text title" x="620" y="521">Compact context</text>
  <text class="text" x="620" y="545">active: 22.50%</text>
  <text class="text" x="620" y="564">active potential: 45.82%</text>

  <rect class="box core" x="600" y="620" width="220" height="96"/>
  <text class="text title" x="620" y="649">Bootloader</text>
  <text class="text" x="620" y="673">final prompt</text>
  <text class="text" x="620" y="692">schema + metrics</text>

  <rect class="box llm" x="890" y="196" width="190" height="110"/>
  <text class="text title" x="912" y="226">LLM / Gemma</text>
  <text class="text" x="912" y="250">one inference</text>
  <text class="text" x="912" y="269">multi-flow response</text>

  <rect class="box output" x="990" y="78" width="190" height="80"/>
  <text class="text title" x="1010" y="106">User response</text>
  <text class="text" x="1010" y="130">final text</text>

  <rect class="box output" x="990" y="340" width="190" height="80"/>
  <text class="text title" x="1010" y="368">Memory / noemas</text>
  <text class="text" x="1010" y="392">optional updates</text>

  <rect class="box audit" x="990" y="462" width="190" height="92"/>
  <text class="text title" x="1010" y="490">Metrics + audit</text>
  <text class="text" x="1010" y="514">trace, checks,</text>
  <text class="text" x="1010" y="533">next actions</text>

  <path class="strong" d="M250 115 C285 115 285 138 320 138"/>
  <path class="edge" d="M250 223 C285 223 285 250 320 250"/>
  <path class="edge" d="M250 337 C286 337 288 174 320 158"/>
  <path class="strong" d="M430 184 L430 220"/>
  <path class="strong" d="M430 324 L430 360"/>
  <path class="strong" d="M540 270 C570 270 570 138 600 138"/>
  <path class="strong" d="M540 408 C570 408 570 158 600 158"/>
  <path class="strong" d="M710 184 L710 220"/>
  <path class="strong" d="M710 312 L710 348"/>
  <path class="strong" d="M710 456 L710 492"/>
  <path class="strong" d="M710 584 L710 620"/>
  <path class="strong" d="M820 668 C850 668 850 270 890 270"/>
  <path class="strong" d="M1080 250 C1120 250 1120 118 990 118"/>
  <path class="edge" d="M1080 250 C1120 250 1120 380 990 380"/>
  <path class="edge" d="M1080 250 C1140 250 1140 508 990 508"/>
  <path class="dash" d="M820 402 C900 442 900 490 990 508"/>

  <text class="label" x="274" y="107">N contexts</text>
  <text class="label" x="456" y="207">regression</text>
  <text class="label" x="560" y="382">progression</text>
  <text class="label" x="832" y="392">judgment</text>
  <text class="label" x="836" y="184">1 call</text>
</svg>
